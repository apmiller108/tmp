x-base: &base
  env_file: .env
  tty: true
  stdin_open: true
  build:
    context: .
    dockerfile: Dockerfile.dev

services:
  database:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PG_DATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 150m
  redis:
    image: redis:7
    restart: always
    volumes:
      - "redis:/data"
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 50m
  ws:
    image: anycable/anycable-go:1.4
    ports:
      - '8085:8085'
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 50m
  app:
    <<: *base
    command: bash -c "rm -f tmp/pids/server.pid && /rails/bin/dev"
    restart: always
    volumes:
      - ".:/rails"
      - "/rails/node_modules" # don't mount node_modules
    ports:
      - "3000"
    links:
      - "database"
      - "redis"
    environment:
      RUBY_DEBUG_IRB_CONSOLE: 1
    depends_on:
      database:
        condition: service_healthy
    mem_limit: "${TMP_APP_MEM_LIMIT:-1000m}"
  sidekiq:
    <<: *base
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: "bundle exec sidekiq"
    restart: always
    volumes:
      - ".:/rails"
      - "/rails/tmp" # don't mount tmp
    mem_limit: "${TMP_SIDEKIQ_MEM_LIMIT:-500m}"
  anycable:
    <<: *base
    command: bundle exec anycable
    volumes:
      - ".:/rails"
    ports:
      - "50051"
    depends_on:
      database:
        condition: service_healthy
      ws:
        condition: service_started
    env_file:
      - ".env"
    mem_limit: "${TMP_ANYCABLE_MEM_LIMIT:-250m}"
  nginx:
    image: nginx:1.27
    links:
      - "app"
    volumes:
      - "./config/nginx/development:/etc/nginx/conf.d"
      - "./app/assets:/app/public"
    ports:
      - "3000:80"
    mem_limit: 50m
  chrome: # docker-compose up -d chrome
    image: browserless/chrome:latest # See https://www.browserless.io/docs/docker
    ports:
      - "3333:3333"
    volumes:
      - .:/app:cached
    environment:
      PORT: 3333
      CONNECTION_TIMEOUT: -1 # No timeout
    mem_limit: "${TMP_CHROME_MEM_LIMIT:-500m}"

volumes:
  redis:
  postgres:
