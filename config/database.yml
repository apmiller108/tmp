default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV['TMP_USE_LOCAL_DB'].present? ? 'localhost' : ENV.fetch('POSTGRES_HOST') %>
  user: <%= ENV.fetch('POSTGRES_USER') %>
  password: <%= ENV.fetch('POSTGRES_PASSWORD') %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
development:
  <<: *default
  database: tmp_development
test:
  <<: *default
  database: tmp_test
production:
  <<: *default
  database: tmp_production
  username: tmp
  password: <%= ENV['SUPER_SECRET_DATABASE_PASSWORD'] %>
