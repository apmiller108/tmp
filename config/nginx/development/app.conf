upstream app {
  server 'app:3000';
}
server {
  listen 80;
  server_name localhost;
  root /app/public;

  # Disables the display of Nginx version information in error pages and HTTP headers
  server_tokens off;

  error_page 404 /404.html;
  error_page 422 /422.html;
  error_page 500 502 504 /500.html;
  error_page 503 @503;

  # This directive attempts to serve the requested file directly from the
  # filesystem at the server root. If the file does not exist, it passes the
  # request to the @rails location block.
  location / {
    try_files $uri @rails;
  }

  # Serve assets from the builds directory
  location ~ ^/assets/builds/ {
    # Fingerprinted files cached forever
    expires max;
    add_header Cache-Control public;
    # access_log off;
    gzip_static on; # to serve pre-gzipped version
    # No need to pass to Rails if the file exists
    try_files $uri =404;
  }

  location @rails {
    proxy_set_header  X-Real-IP  $remote_addr;
    proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_redirect off;
    proxy_pass http://app;
  }
}
